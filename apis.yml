aid: deep-rooted
name: Deep Rooted
description: 'Deep Rooted.Co is a direct-to-consumer fresh produce brand operated by Clover
  Ventures Pvt. Ltd, a Bengaluru-based agritech company founded in 2018 that launched the
  Deep Rooted consumer brand in 2020. The company works with a network of small-scale farmers
  using greenhouse and hydroponic techniques within roughly 150km of Bengaluru and Hyderabad,
  providing agronomy support from seed to harvest and delivering fruits, vegetables, Indian
  staples and greens, exotic produce and an easy-cook range direct to households the morning
  after ordering. Deep Rooted is backed by Accel. It sells through a consumer web storefront
  and mobile apps; it publishes no public developer portal, API documentation, or machine-readable
  API specification, so this profile captures company identity and web properties only.'
